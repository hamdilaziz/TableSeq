[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tableseq"
version = "0.1.0"
description = "Unified autoregressive generation of table structure, content, and cell coordinates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Laziz Hamdi" },
]
keywords = ["document-ai", "table-recognition", "table-structure-recognition", "deep-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "apted>=1.0.3",
  "lxml>=4.9",
  "numpy>=1.24",
  "Pillow>=10.0",
  "rapidfuzz>=3.0",
  "torch>=2.2",
  "tqdm>=4.66",
  "transformers>=4.49,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
tableseq-infer = "tableseq.run_tableseq:main"

[project.urls]
Repository = "https://github.com/hamdilaziz/TableSeq"
Paper = "https://doi.org/10.1007/s10032-026-00586-6"
Weights = "https://zenodo.org/records/21597715"
Issues = "https://github.com/hamdilaziz/TableSeq/issues"

[tool.setuptools.packages.find]
include = ["tableseq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
